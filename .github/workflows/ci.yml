name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: holder
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: holder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U holder -d holder"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://holder:test-only@localhost:5432/holder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://holder:test-only@localhost:5432/holder
      - run: docker build -t holder-bot:ci .
